<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عرض المنتج بالواقع المعزز</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
    
    <style>
        body { margin: 0; padding: 0; height: 100vh; display: flex; justify-content: center; align-items: center; background-color: #ffffff; }
        model-viewer { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <model-viewer 
        src="nakha3d.glb" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        camera-controls 
        auto-rotate 
        shadow-intensity="1">
    </model-viewer>

</body>
</html>
<body style="text-align: center; font-family: 'Segoe UI', sans-serif; padding: 30px; background-color: #f4f4f4;">

    <h1 style="color: #2c3e50;">شكراً لثقتك بـ Nakha3D!</h1>
    <p style="color: #7f8c8d;">سعدنا بخدمتك. نأمل أن ينال هذا التصميم إعجابك.</p>
    
    <model-viewer 
        src="nakha3d.glb" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        camera-controls 
        auto-rotate 
        style="width: 100%; height: 400px; background-color: #ffffff; border-radius: 15px; margin: 20px 0;">
    </model-viewer>

    <p style="font-size: 14px; color: #95a5a6;">يمكنك الضغط على أيقونة المكعب لرؤية التصميم في الواقع.</p>
</body>
